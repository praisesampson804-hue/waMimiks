<html lang="en">
<head>

<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1b1b1b;--mut:#6b6b6b;--bd:#e2e2de;--ac:#128c7e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1e1e1e;--tx:#ececec;--mut:#9a9a9a;--bd:#333;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--tx:#ececec;--mut:#9a9a9a;--bd:#333;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.l{font-size:12px;color:var(--mut);display:block;margin:12px 0 4px}
input[type=text],textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;font:inherit}
textarea{resize:vertical;min-height:56px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.sm{padding:5px 9px;font-size:13px}
.pill.me{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip{border-radius:20px;padding:8px 13px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 14px;font-size:14px}
.seg button.on{background:var(--ac);color:#fff}
.tabs{display:flex;gap:4px;margin:10px 0 14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--ac);color:#fff;font-weight:600}
.view{display:none}.view.on{display:block}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.opt input{width:20px;height:20px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);z-index:5}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar button{flex:1;padding:12px}
.bar #back{flex:0 0 34%}
.stage{display:flex;justify-content:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px;color:#fff;text-align:center}
.ov img{max-width:100%;max-height:70vh;border-radius:8px}
/* ---- screenshot ---- */
#shot{width:100%;max-width:440px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--wbg:#0b141a;--hd:#1f2c34;--hdt:#e9edef;--me:#005c4b;--th:#202c33;--tx2:#e9edef;--tt:#8696a0;--in:#1f2c34;background:var(--wbg);color:var(--tx2)}
#shot.light{--wbg:#efeae2;--hd:#008069;--hdt:#fff;--me:#d9fdd3;--th:#fff;--tx2:#111b21;--tt:#667781;--in:#fff}
.wh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--hd);color:var(--hdt)}
.wh svg{width:22px;height:22px;stroke:var(--hdt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:600;flex:none}
.nm{flex:1;min-width:0;line-height:1.25}
.nm b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:12.5px;opacity:.8}
.wb{min-height:440px;padding:12px 10px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px}
.dt{align-self:center;background:var(--th);color:var(--tt);font-size:12px;padding:5px 11px;border-radius:8px;margin-bottom:8px}
.b{max-width:80%;padding:6px 9px 5px;border-radius:9px;font-size:16px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;color:var(--tx2)}
.b.me{align-self:flex-end;background:var(--me)}
.b.th{align-self:flex-start;background:var(--th)}
.b.me.f{border-top-right-radius:0;margin-top:6px}
.b.th.f{border-top-left-radius:0;margin-top:6px}
.tm{float:right;margin:7px 0 -3px 10px;font-size:11px;color:var(--tt);display:inline-flex;align-items:center;gap:3px}
.tk{width:16px;height:11px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wi{display:flex;gap:8px;padding:8px 8px 14px;align-items:center}
.wi .p{flex:1;background:var(--in);border-radius:24px;padding:11px 16px;color:var(--tt);font-size:16px}
.wi .mic{width:46px;height:46px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center}
.wi .mic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <h1>WhatsApp Chat Maker</h1>
  <div class="tabs" id="tabs"><button class="on">1 · Write</button><button>2 · Style</button><button>3 · Preview</button></div>

  <div class="view on" id="vChat">
    <p class="sub">Type each message. Tap the badge to switch who’s talking.</p>
    <div id="list"></div>
    <div class="row"><button id="addM">+ Me</button><button id="addT">+ Them</button></div>
    <p class="sub" style="margin-top:18px">Need an idea? Tap one:</p>
    <div class="row" id="chips"></div>
  </div>

  <div class="view" id="vStyle"><div class="card">
    <label class="l" style="margin-top:0">Theme</label>
    <div class="seg" id="themeSeg"><button data-t="dark" class="on">Dark</button><button data-t="light">Light</button></div>
    <label class="l">Contact name</label><input type="text" id="cname" value="Mom ❤️">
    <label class="l">Status under the name</label><input type="text" id="cstat" value="online">
    <label class="l">Avatar (an emoji, or leave empty for first letter)</label><input type="text" id="cav" value="">
    <label class="l">First message time</label><input type="text" id="start" value="10:41 PM">
    <label class="opt" style="margin-top:12px"><input type="checkbox" id="blue" checked> Blue ticks (read)</label>
    <label class="opt"><input type="checkbox" id="showDate" checked> Show “Today” label</label>
    <label class="opt"><input type="checkbox" id="showInput" checked> Show message input bar</label>
  </div></div>

  <div class="view" id="vPrev">
    <p class="sub">Looks good? Tap Download JPG below.</p>
    <div class="stage"><div id="shot"></div></div>
  </div>
</div>

<div class="bar"><div class="in"><button id="back" style="display:none">← Edit</button><button class="pri" id="next">Preview →</button></div></div>
<div class="ov" id="ov"><div>Press and hold the image to save it</div><img id="ovImg" alt="Your chat"><button id="ovX">Close</button></div>
<!-- NEW AD OVERLAY -->
<div class="ov" id="adOv" style="z-index:30">
  <div style="font-size:22px;font-weight:700;margin-bottom:8px">Thanks for using Chat Maker! 💚</div>
  <div style="font-size:15px;opacity:0.8;margin-bottom:20px;max-width:280px;line-height:1.4">
    Your download has started. Please check out our sponsor to keep this tool free!
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px">
    <a href="#" id="adOpenBtn" target="_blank" class="pri" style="text-decoration:none;display:block;text-align:center;padding:12px;font-size:16px;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;border:none">Open Link</a>
    <button id="adSkipBtn" style="padding:12px;font-size:15px;background:transparent;color:#fff;border:none;text-decoration:underline;opacity:0.7">Skip to download</button>
  </div>
</div>
<script>
/* --- START OF AD CONFIGURATION --- */
var AD_URL = "https://wa.me/?text=Bro%2C%20this%20WhatsApp%20chat%20generator%20is%20too%20accurate%20%F0%9F%98%82%20Make%20your%20own%20fake%20chat%20here%3A%20https%3A%2F%2Fshorturl.at%2FANUzJ"; // <-- PUT YOUR AD LINK HERE
var AD_COOLDOWN_DAYS = 7;
var adSessionShown = false; // Prevents showing the ad more than once per session

function isAdDue() {
  // If already shown this session, don't show it again
  if (adSessionShown) return false;

  try {
    var lastShown = localStorage.getItem("wcm_lastAd");
    if (!lastShown) return true; // Never shown before

    var now = new Date().getTime();
    var cooldownMs = AD_COOLDOWN_DAYS * 24 * 60 * 60 * 1000;
    
    // If 7 days have passed, it's due
    return (now - parseInt(lastShown, 10)) >= cooldownMs;
  } catch (e) {
    // If localStorage is blocked (e.g. strict private mode), 
    // we just show it once per session.
    return true; 
  }
}

function markAdShown() {
  adSessionShown = true;
  try {
    localStorage.setItem("wcm_lastAd", new Date().getTime().toString());
  } catch (e) {}
}
/* --- END OF AD CONFIGURATION --- */
var examples=[
 {n:"Mom ❤️",s:"online",m:[["t","Where are you?"],["m","At school"],["t","Which school?? Your school closed 3 hours ago"],["m","…"],["t","I’m coming to check"]]},
 {n:"Landlord",s:"typing…",m:[["t","Rent is due tomorrow"],["m","Noted 🙏"],["t","Is that a yes?"],["m","Noted 🙏"]]},
 {n:"Crush 😍",s:"last seen today at 9:02 PM",m:[["m","Hi"],["m","Are you free tonight?"],["m","Hello??"],["m","I know you saw this"]]}
];
var S={theme:"dark",msgs:[["t","Where are you?"],["m","At school"],["t","Which school?? Your school closed 3 hours ago"],["m","…"],["t","I’m coming to check"]]};
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function nm(){return $("cname").value||"Contact"}
function tm(i){
  var m=$("start").value.match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i),h=m?+m[1]:10,mi=m?+m[2]:41,ap=m&&m[3]?m[3].toUpperCase():null;
  var t=ap?((h%12)+(ap==="PM"?12:0))*60+mi:h*60+mi;t=(((t+i)%1440)+1440)%1440;
  var H=Math.floor(t/60),M=("0"+(t%60)).slice(-2);
  if(ap){var a=H>=12?"PM":"AM";return (H%12||12)+":"+M+" "+a}
  return ("0"+H).slice(-2)+":"+M;
}
var COL=["#c0392b","#8e44ad","#2980b9","#16a085","#d35400","#7f8c8d","#2c3e50"];
function drawShot(){
  var sh=$("shot");sh.className=S.theme==="light"?"light":"";
  var n=nm(),av=$("cav").value.trim()||n.replace(/[^\p{L}\p{N}]/gu,"").charAt(0).toUpperCase()||"?";
  var c=COL[(n.length)%COL.length];
  var I=function(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>'};
  var h='<div class="wh">'+I('<path d="M15 5l-7 7 7 7"/>')+'<div class="av" style="background:'+c+'">'+esc(av)+'</div><div class="nm"><b>'+esc(n)+'</b>'+($("cstat").value?'<small>'+esc($("cstat").value)+'</small>':'')+'</div>'+I('<rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3"/>')+I('<path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2"/>')+I('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>')+'</div>';
  var tick=$("blue").checked?"#53bdeb":"#8696a0";
  var b='<div class="wb">'+($("showDate").checked?'<div class="dt">Today</div>':'');
  S.msgs.forEach(function(x,i){
    var me=x[0]==="m",first=i===0||S.msgs[i-1][0]!==x[0];
    b+='<div class="b '+(me?"me":"th")+(first?" f":"")+'">'+esc(x[1])+'<span class="tm">'+tm(i)+(me?'<svg class="tk" viewBox="0 0 16 11" style="stroke:'+tick+'"><path d="M1 6l3 3L10.500 1.500M6 8.500l.8.8L14 1.500"/></svg>':'')+'</span></div>';
  });
  b+='</div>';
  var f=$("showInput").checked?'<div class="wi"><div class="p">Message</div><div class="mic">'+I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>')+'</div></div>':'';
  sh.innerHTML=h+b+f;
}
function drawList(){
  var L=$("list");L.innerHTML="";
  S.msgs.forEach(function(x,n){
    var d=document.createElement("div");d.className="card";
    var top=document.createElement("div");top.className="row";top.style.cssText="justify-content:space-between;margin-bottom:6px";
    var tg=document.createElement("button");tg.className="sm pill "+(x[0]==="m"?"me":"");tg.textContent=(x[0]==="m"?"📤 Me":"📥 "+nm())+"  ⇄";
    tg.onclick=function(){x[0]=x[0]==="m"?"t":"m";drawList();drawShot()};
    var del=document.createElement("button");del.className="sm";del.textContent="✕";
    del.onclick=function(){S.msgs.splice(n,1);drawList();drawShot()};
    top.appendChild(tg);top.appendChild(del);
    var ta=document.createElement("textarea");ta.value=x[1];ta.placeholder="Type a message";
    ta.oninput=function(){x[1]=ta.value;drawShot()};
    d.appendChild(top);d.appendChild(ta);L.appendChild(d);
  });
  if(!S.msgs.length)L.innerHTML='<div class="card sub">No messages yet. Add one below.</div>';
  $("addT").textContent="+ "+nm();
}
function addMsg(r){S.msgs.push([r,""]);drawList();drawShot();var t=document.querySelectorAll("#list textarea");t[t.length-1].focus()}
$("addM").onclick=function(){addMsg("m")};
$("addT").onclick=function(){addMsg("t")};
["cname","cstat","cav","start"].forEach(function(i){$(i).oninput=function(){drawShot();if(i==="cname")drawList()}});
["blue","showDate","showInput"].forEach(function(i){$(i).onchange=drawShot});
Array.prototype.forEach.call($("themeSeg").children,function(b){
  b.onclick=function(){S.theme=b.dataset.t;Array.prototype.forEach.call($("themeSeg").children,function(c){c.className=c===b?"on":""});drawShot()}});
["👩 Mom","🏠 Landlord","😍 Crush"].forEach(function(l,i){
  var b=document.createElement("button");b.className="chip";b.textContent=l;
  b.onclick=function(){var e=examples[i];S.msgs=JSON.parse(JSON.stringify(e.m));$("cname").value=e.n;$("cstat").value=e.s;drawList();drawShot()};
  $("chips").appendChild(b)});

var dlCap=null;
try{ if(window.claude&&claude.use){ claude.use("downloads").then(function(d){dlCap=d}).catch(function(){}) } }catch(e){}
$("ovX").onclick=function(){$("ov").style.display="none"};
/* --- AD OVERLAY BUTTONS --- */
$("adSkipBtn").onclick = function() {
  $("adOv").style.display = "none";
};

$("adOpenBtn").onclick = function() {
  markAdShown(); // Save the date so it doesn't show again for 7 days
  $("adOv").style.display = "none"; // Hide the overlay
  // The <a> tag handles opening the link in a new tab automatically
};
function showImg(c){$("ovImg").src=c.toDataURL("image/jpeg",0.95);$("ov").style.display="flex"}
function doDl(){
  var btn=$("next");btn.disabled=true;btn.textContent="Making JPG…";
  html2canvas($("shot"),{scale:3,backgroundColor:S.theme==="light"?"#efeae2":"#0b141a",useCORS:true}).then(function(c){
    c.toBlob(function(b){
      btn.disabled=false;btn.textContent="Download JPG";
      if(!b)return;
      if(dlCap){dlCap.save({filename:"whatsapp-chat.jpg",data:b}).catch(function(e){if(!e||e.code!=="declined")showImg(c)})}
      else{try{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="whatsapp-chat.jpg";document.body.appendChild(a);a.click();a.remove()}catch(e){showImg(c)}}
        },"image/jpeg",0.95);

    // --- NEW: Trigger Ad Overlay if due ---
    if (isAdDue()) {
      $("adOpenBtn").href = AD_URL; // Set your link from Addition 1
      // Small delay to ensure the download starts before the overlay covers the screen
      setTimeout(function() {
        $("adOv").style.display = "flex";
      }, 500); 
    }

  }).catch(function(){btn.disabled=false;btn.textContent="Download JPG"});
}
var cur=0,vs=["Chat","Style","Prev"],tb=$("tabs").children;
function go(n){cur=n;vs.forEach(function(v,i){$("v"+v).className="view"+(i===n?" on":"");tb[i].className=i===n?"on":""});
  $("back").style.display=n===0?"none":"";
  $("next").textContent=n===2?"Download JPG":"Preview →";
  if(n===2)drawShot();window.scrollTo(0,0)}
Array.prototype.forEach.call(tb,function(b,i){b.onclick=function(){go(i)}});
$("back").onclick=function(){go(0)};
$("next").onclick=function(){if(cur===2)doDl();else go(2)};
drawList();drawShot();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
